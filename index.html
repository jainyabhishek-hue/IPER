<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1526">
<title>IPER – Financial Premier League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a1526; --night-2:#0f2140; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --turf:#1e8a5a; --turf-2:#3ddc97; --ball:#e3453a; --gold:#f6c453; --sky:#5ec2ff;
  --bone:#f2eee6; --muted:#8fa3bf; --muted-2:#5b6f8c;
  --display:'Big Shoulders Display',Impact,sans-serif; --body:'Manrope',system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body);color:var(--bone);background:var(--night);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;
  font-size:14px;line-height:1.45;
}
/* floodlit night sky */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% -20%, rgba(94,194,255,.20), transparent 60%),
    radial-gradient(60% 40% at 15% 110%, rgba(61,220,151,.14), transparent 60%),
    radial-gradient(60% 40% at 90% 105%, rgba(246,196,83,.10), transparent 60%),
    linear-gradient(180deg,#0d1c34 0%, var(--night) 60%, #070f1c 100%);
}
.sky::before{content:"";position:absolute;inset:-10%;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 42px, transparent 42px 84px);
  transform:perspective(600px) rotateX(62deg) translateY(30%);transform-origin:bottom;opacity:.7}
.sky::after{content:"";position:absolute;left:50%;top:-40vh;width:120vw;height:80vh;transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(255,255,255,.08), transparent);filter:blur(30px)}
.stage{position:relative;z-index:1;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)) 14px;gap:12px}

/* ============ SCOREBOARD ============ */
#top-scoreboard{display:none;background:linear-gradient(180deg,#132a4d,#0e1f3b);border:1px solid var(--line-2);
  border-radius:var(--r-lg);padding:12px 14px 10px;box-shadow:0 18px 40px -20px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);
  animation:boardIn .5s var(--ease-out) both}
#top-scoreboard.on{display:block}
.board-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.board-name{font-size:11px;font-weight:700;color:var(--sky);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.board-runs{display:flex;align-items:baseline;gap:6px;margin-top:-2px}
#runs{font-family:var(--display);font-weight:900;font-size:54px;line-height:.9;color:var(--gold);
  text-shadow:0 0 22px rgba(246,196,83,.35);font-variant-numeric:tabular-nums;transition:transform .25s var(--ease-spring)}
#runs.bump{transform:scale(1.18)}
.board-runs small{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
#ball-counter{font-size:11px;font-weight:700;color:var(--turf-2);margin-left:8px}
/* ring timer */
.ring{position:relative;width:64px;height:64px;flex:0 0 64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:5}
.ring .arc{fill:none;stroke:var(--turf-2);stroke-width:5;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:0;
  transition:stroke-dashoffset 1s linear, stroke .4s;filter:drop-shadow(0 0 6px rgba(61,220,151,.5))}
.ring.warn .arc{stroke:var(--gold);filter:drop-shadow(0 0 6px rgba(246,196,83,.5))}
.ring.danger .arc{stroke:var(--ball);filter:drop-shadow(0 0 8px rgba(227,69,58,.7))}
.ring.danger #timer{color:var(--ball);animation:tick .5s ease-in-out infinite alternate}
#timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--bone);font-variant-numeric:tabular-nums}
#timer span{font-size:9px;font-family:var(--body);font-weight:700;color:var(--muted);margin-top:-2px;display:block;text-align:center}
@keyframes tick{from{transform:scale(1)}to{transform:scale(1.12)}}
/* 20-ball strip */
.balls{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.balls i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.10);transition:background .3s,transform .3s;position:relative}
.balls i.now{background:var(--sky);animation:pulseDot 1s ease-in-out infinite}
.balls i.six{background:var(--gold)} .balls i.four{background:var(--turf-2)} .balls i.run{background:#7bb7e0} .balls i.out{background:var(--ball)}
.balls i.sep{margin-right:2px} .balls i.done{background:rgba(255,255,255,.45)}
.result-big.good{color:var(--turf-2);text-shadow:0 0 30px rgba(61,220,151,.6)}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ ARENA ============ */
#game-arena{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.screen{width:100%;max-height:100%;animation:screenIn .45s var(--ease-out) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes boardIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px 20px;width:100%;box-shadow:0 30px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06)}
.h-display{font-family:var(--display);font-weight:900;letter-spacing:.01em;line-height:.95}
.eyebrow{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.input-field{width:100%;background:rgba(6,14,28,.75);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 12px;color:var(--bone);
  font-family:var(--body);font-size:15px;font-weight:700;outline:none;transition:border-color .2s, box-shadow .2s;-webkit-user-select:text;user-select:text}
.input-field::placeholder{color:var(--muted-2);font-weight:600}
.input-field:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(94,194,255,.18)}
button{font-family:var(--body);font-weight:700;color:var(--bone);background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:11px 10px;font-size:13px;cursor:pointer;transition:transform .12s var(--ease-out), background .2s, border-color .2s, box-shadow .2s, color .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.action-btn{width:100%;padding:15px;margin-top:12px;font-size:15px;font-weight:800;letter-spacing:.02em;border:none;border-radius:var(--r-md);color:#06251a;
  background:linear-gradient(180deg,#4ff0a9,#22b876);box-shadow:0 10px 24px -10px rgba(61,220,151,.7), inset 0 1px 0 rgba(255,255,255,.35)}
.action-btn:active{transform:scale(.98)}
.action-btn.gold{color:#2b1d00;background:linear-gradient(180deg,#ffd873,#e9b43a);box-shadow:0 10px 24px -10px rgba(246,196,83,.7), inset 0 1px 0 rgba(255,255,255,.4)}
.action-btn.quiet{color:var(--bone);background:var(--panel-2);border:1px solid var(--line-2);box-shadow:none}
.form-notice{display:none;margin-top:10px;padding:9px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:700;background:rgba(227,69,58,.14);
  border:1px solid rgba(227,69,58,.5);color:#ffb4ad;animation:shakeX .4s}
@keyframes shakeX{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* welcome */
.crest{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%,#ff8a7c,#c2281c 60%,#7a1208);box-shadow:0 14px 30px -10px rgba(227,69,58,.8), inset -6px -8px 14px rgba(0,0,0,.35);
  animation:seam 6s ease-in-out infinite}
.crest::before{content:"";position:absolute;inset:8px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);transform:rotate(25deg)}
.crest::after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);transform:rotate(25deg)}
.crest span{font-size:36px;position:relative;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
@keyframes seam{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(8deg)}}
.title-lg{font-size:44px;color:var(--bone)}
.title-sub{font-family:var(--display);font-size:22px;font-weight:800;color:var(--turf-2);letter-spacing:.06em;margin-top:2px}
.mode-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);margin:10px 0 2px;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.mode-tag b{width:6px;height:6px;border-radius:50%;background:var(--turf-2);box-shadow:0 0 8px var(--turf-2)}
.mode-tag.off b{background:var(--muted-2);box-shadow:none}

/* rules */
.rules{display:grid;gap:10px;max-height:min(46vh,340px);overflow-y:auto;padding-right:4px;margin:14px 0 6px}
.rule{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:12.5px;color:#cfd8e6;line-height:1.5}
.rule b{color:var(--bone);display:block}
.rule i{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-size:16px}
.rule.alert i{background:rgba(227,69,58,.15);border-color:rgba(227,69,58,.4)}
.runs-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.runs-scale div{border-radius:8px;padding:6px 4px;text-align:center;background:rgba(6,14,28,.6);border:1px solid var(--line)}
.runs-scale strong{font-family:var(--display);font-size:22px;font-weight:900;display:block;line-height:1}
.runs-scale small{font-size:10px;color:var(--muted);font-weight:700}

/* question */
.delivery{background:rgba(6,14,28,.7);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 14px;margin-bottom:12px;min-height:84px;display:flex;align-items:center;position:relative;overflow:hidden}
.delivery::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--sky),var(--turf-2))}
.delivery p{font-size:15px;font-weight:700;line-height:1.45;color:#f7f4ee;animation:screenIn .5s var(--ease-out) both}
.leg{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin-bottom:10px;transition:border-color .3s, background .3s}
.leg.done{border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.05)}
.leg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.leg-head span{font-size:11px;font-weight:800;color:var(--sky)}
.leg-head em{font-style:normal;font-size:10px;font-weight:700;color:var(--muted-2)}
.leg.done .leg-head em{color:var(--turf-2)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid3 button,.grid2 button{padding:12px 6px;font-size:13px}
.selected-btn{background:linear-gradient(180deg,#3ddc97,#22b876)!important;color:#06251a!important;border-color:transparent!important;
  box-shadow:0 8px 18px -8px rgba(61,220,151,.9)!important;animation:pick .25s var(--ease-spring)}
@keyframes pick{from{transform:scale(.9)}to{transform:scale(1)}}
.sel-inc.selected-btn{background:linear-gradient(180deg,#5ec2ff,#2c9be0)!important;color:#03203a!important;box-shadow:0 8px 18px -8px rgba(94,194,255,.9)!important}
.sel-dec.selected-btn{background:linear-gradient(180deg,#ff9a90,#e3453a)!important;color:#3a0a06!important;box-shadow:0 8px 18px -8px rgba(227,69,58,.9)!important}

/* overlay + result */
.overlay{position:absolute;inset:-4px;border-radius:var(--r-lg);background:rgba(5,10,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;z-index:50;animation:fadeIn .25s both;overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pop-card{background:linear-gradient(180deg,#152d52,#0f2140);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:26px 22px 20px;width:92%;max-width:330px;
  text-align:center;box-shadow:0 40px 80px -30px rgba(0,0,0,1);animation:popIn .55s var(--ease-spring) both;position:relative}
@keyframes popIn{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
.result-big{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;letter-spacing:.01em}
.result-big.six{color:var(--gold);text-shadow:0 0 30px rgba(246,196,83,.6)}
.result-big.four{color:var(--turf-2);text-shadow:0 0 30px rgba(61,220,151,.6)}
.result-big.run{color:var(--sky)}
.result-big.out{color:var(--ball);text-shadow:0 0 30px rgba(227,69,58,.6)}
.result-big.warn{color:#ff9a5c}
.result-sub{font-size:12px;font-weight:800;color:var(--bone);margin-top:6px;letter-spacing:.02em}
.result-emoji{font-size:40px;display:block;margin-bottom:6px;animation:popIn .6s .1s var(--ease-spring) both}
.verify{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;text-align:left}
.verify span{font-size:10px;font-weight:800;color:var(--sky);display:block;margin-bottom:3px}
.verify p{font-size:12px;color:#cfd8e6;line-height:1.5}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.flash{position:absolute;inset:0;pointer-events:none;border-radius:var(--r-lg);animation:flash .6s ease-out both}
.flash.red{background:rgba(227,69,58,.35)} .flash.gold{background:rgba(246,196,83,.25)}
@keyframes flash{from{opacity:1}to{opacity:0}}
.confetti{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall linear both;pointer-events:none}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(120vh) rotate(720deg)}}

/* draft */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.team{padding:14px 10px;border-radius:var(--r-md);background:rgba(6,14,28,.6);border:1px solid var(--line);display:grid;justify-items:center;gap:8px;animation:screenIn .5s var(--ease-out) both}
.team:nth-child(2){animation-delay:.06s}.team:nth-child(3){animation-delay:.12s}.team:nth-child(4){animation-delay:.18s}
.team:hover{border-color:var(--sky);background:rgba(94,194,255,.08)}
.team .mono{width:46px;height:46px;font-size:20px;letter-spacing:-.02em;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:900;color:#06251a}
.team b{font-size:12.5px;font-weight:800;color:var(--bone)}
.team small{font-size:10px;color:var(--muted);font-weight:700}

/* summary */
.summary{display:flex;flex-direction:column;max-height:100%;height:min(88vh,760px)}
.trophy{font-size:44px;display:block;animation:trophy 1.2s var(--ease-spring) both}
@keyframes trophy{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:none}}
.final{font-family:var(--display);font-weight:900;font-size:72px;line-height:.9;color:var(--gold);text-shadow:0 0 30px rgba(246,196,83,.4);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.stat{background:rgba(6,14,28,.6);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.stat strong{font-family:var(--display);font-size:24px;font-weight:900;display:block;line-height:1}
.stat small{font-size:10px;color:var(--muted);font-weight:700}
.sync-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line-2);background:rgba(6,14,28,.6);color:var(--muted);margin:0 auto;transition:all .3s}
.sync-pill.ok{border-color:var(--turf-2);color:var(--turf-2)} .sync-pill.err{border-color:var(--ball);color:#ffb4ad} .sync-pill.busy{border-color:var(--gold);color:var(--gold)} .sync-pill.off{color:var(--muted)}
.retry-link{background:none;border:none;padding:0 0 0 4px;color:var(--sky);font-size:11px;text-decoration:underline}
.ledger{flex:1;min-height:0;overflow-y:auto;padding-right:2px;border-top:1px solid var(--line);padding-top:10px;margin:8px 0 10px;display:grid;gap:8px;align-content:start}
.entry{text-align:left;display:grid;grid-template-columns:38px 1fr;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px;animation:screenIn .4s var(--ease-out) both}
.entry .badge{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;height:38px;border-radius:10px;display:grid;place-items:center}
.entry.hit .badge{background:rgba(61,220,151,.15);color:var(--turf-2)} .entry.six .badge{background:rgba(246,196,83,.15);color:var(--gold)} .entry.out .badge{background:rgba(227,69,58,.15);color:var(--ball)}
.entry h4{font-size:12px;font-weight:700;color:var(--bone);line-height:1.4}
.entry p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.entry p b{color:var(--sky);font-weight:800}

/* commentary */
#commentary{background:rgba(6,14,28,.6);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;display:flex;align-items:center;gap:10px;min-height:48px;transition:border-color .4s}
#commentary::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:0 0 8px;transition:background .4s, box-shadow .4s}
#commentary.pos{border-color:rgba(61,220,151,.5)} #commentary.pos::before{background:var(--turf-2);box-shadow:0 0 10px var(--turf-2)}
#commentary.neg{border-color:rgba(227,69,58,.5)} #commentary.neg::before{background:var(--ball);box-shadow:0 0 10px var(--ball)}
#commentary p{font-size:12.5px;font-weight:600;color:#c9d3e2;animation:screenIn .35s var(--ease-out) both}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="stage">
  <header id="top-scoreboard">
    <div class="board-row">
      <div>
        <div id="player-display" class="board-name">Batsman</div>
        <div class="board-runs"><span id="runs-wrap"><span id="runs">0</span><small>RUNS</small></span><span id="ball-counter">0/20 balls</span></div>
      </div>
      <div class="ring" id="timer-box">
        <svg viewBox="0 0 60 60"><circle class="track" cx="30" cy="30" r="26"/><circle class="arc" id="arc" cx="30" cy="30" r="26"/></svg>
        <div id="timer">30</div>
      </div>
    </div>
    <div class="balls" id="ball-strip"></div>
  </header>
  <main id="game-arena"></main>
  <footer id="commentary"><p>Stadium lights on. Waiting for the batsman to register.</p></footer>
</div>

<script>
// =====================================================================
//  GOOGLE SHEETS SCORE COLLECTION - CONFIGURATION
//  1. Create a Google Sheet.  2. Extensions > Apps Script > paste Code.gs.
//  3. Deploy > New deployment > Web app (Execute as: Me, Access: Anyone).
//  4. Paste the /exec URL below. Leave "" to run without logging.
// =====================================================================
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIJ_2oKK8QDi8gcdRS-_yIDHJVfRNLj5kLEUaQZf-qN2aXUASXkaL55y08msY6H5uq/exec";
const SHEET_SECRET = "";
const MATCH_LABEL = "IPER Financial Premier League";
// Set to true if you ever want students to see their runs on screen. When false,
// runs are only written to the Google Sheet and never shown in the game.
const SHOW_SCORES = true;

// ================= HELPERS =================
const $ = id => document.getElementById(id);
function showScreen(html){ $('game-arena').innerHTML = `<div class="screen">${html}</div>`; }
function setCommentaryText(msg,pos){
  const c=$('commentary'); c.innerHTML=`<p>${msg}</p>`;
  c.className = pos===true?'pos':pos===false?'neg':'';
}
function dataset(){ return currentRound===1 ? questions.warmup : dynamicActiveMatchSet; }
function classForRuns(l){ if(!l.wasCorrect) return 'out'; if(l.runs===6) return 'six'; if(l.runs===4) return 'four'; return 'run'; }

function renderBallStrip(){
  const strip=$('ball-strip'); if(!strip) return;
  const ballNum = (currentRound===1)?currentIdx:currentIdx+10;
  strip.innerHTML = Array.from({length:20},(_,i)=>{
    let cls = i<matchLog.length ? (SHOW_SCORES?classForRuns(matchLog[i]):'done') : (i===ballNum && isQuestionActive?'now':'');
    if(i===9) cls+=' sep';
    return `<i class="${cls}"></i>`;
  }).join('');
}
function animateRuns(to){
  if(!SHOW_SCORES) return;
  const el=$('runs'); const from=parseInt(el.innerText)||0; if(from===to||reduceMotion){el.innerText=to;return;}
  el.classList.add('bump'); const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/500); el.innerText=Math.round(from+(to-from)*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); else setTimeout(()=>el.classList.remove('bump'),150);};
  requestAnimationFrame(step);
}
function updateHeaderMetrics(){
  animateRuns(totalRuns);
  const ballNum=(currentRound===1)?currentIdx:currentIdx+10;
  $('ball-counter').innerText=`${ballNum}/20 balls`;
  $('timer-box').className='ring';
  renderBallStrip();
}
function setRing(){
  $('timer').innerHTML = `${timeLeft}<span>SEC</span>`;
  $('arc').style.strokeDashoffset = (163.4*(1-timeLeft/30)).toFixed(1);
  const box=$('timer-box'); box.className = 'ring' + (timeLeft<=5?' danger':timeLeft<15?' warn':'');
}
function confetti(){
  if(reduceMotion) return;
  const host=$('game-arena').querySelector('.overlay'); if(!host) return;
  const colors=['#f6c453','#3ddc97','#5ec2ff','#ff9a90','#ffffff'];
  for(let i=0;i<40;i++){const s=document.createElement('span');s.className='confetti';
    s.style.left=Math.random()*100+'%';s.style.background=colors[i%colors.length];
    s.style.animationDuration=(1.6+Math.random()*1.4)+'s';s.style.animationDelay=(Math.random()*.4)+'s';
    s.style.transform=`rotate(${Math.random()*360}deg)`;host.appendChild(s);}
}
function flash(kind){ const a=$('game-arena'); const f=document.createElement('div'); f.className='flash '+kind; a.appendChild(f); setTimeout(()=>f.remove(),700);
  if(kind==='red'&&!reduceMotion){a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),600);} }

function confirmGuardAndStart(){

function renderQuestion(){
  clearInterval(timerInterval); isQuestionActive=false;
  if(currentIdx>=10){ if(currentRound===1) renderCompanyDraftScreen(); else finalizeScoreAndLogSheet(); return; }
  const qData=dataset()[currentIdx];
  timeLeft=30; currentSelection={leg1:{e:null,d:null},leg2:{e:null,d:null}};
  isQuestionActive=true; updateHeaderMetrics(); startCountdown();
  const ballNum=(currentRound===1)?currentIdx+1:currentIdx+11;
  showScreen(`
    <div class="card" style="padding:16px 14px">
      <div class="eyebrow" style="margin:0 2px 8px">Ball ${ballNum} of 20 · ${currentRound===1?'Warm-up':identifiedCompany}</div>
      <div class="delivery"><p>${qData.q}</p></div>
      ${[1,2].map(leg=>`
        <div class="leg" id="leg${leg}">
          <div class="leg-head"><span>Ledger leg ${leg}</span><em id="leg${leg}-state">Choose element and direction</em></div>
          <div class="grid3">
            <button id="l${leg}-e-A" onclick="allocateSelection('${leg}','e','A')">Asset</button>
            <button id="l${leg}-e-L" onclick="allocateSelection('${leg}','e','L')">Liability</button>
            <button id="l${leg}-e-E" onclick="allocateSelection('${leg}','e','E')">Equity</button>
          </div>
          <div class="grid2">
            <button id="l${leg}-d-plus" class="sel-inc" onclick="allocateSelection('${leg}','d','+')">Increase +</button>
            <button id="l${leg}-d-minus" class="sel-dec" onclick="allocateSelection('${leg}','d','-')">Decrease −</button>
          </div>
        </div>`).join('')}
      <button onclick="evaluateUserStrike()" class="action-btn" style="margin-top:4px">Hit the ball</button>
    </div>`);
}

function allocateSelection(leg,type,val){
  currentSelection[`leg${leg}`][type]=val;
  if(type==='e'){ ['A','L','E'].forEach(v=>{const el=$(`l${leg}-e-${v}`); if(el) el.className=(v===val)?'selected-btn':'';}); }
  else { const el=$(`l${leg}-d-plus`), el2=$(`l${leg}-d-minus`);
    if(el) el.className='sel-inc'+(val==='+'?' selected-btn':''); if(el2) el2.className='sel-dec'+(val==='-'?' selected-btn':''); }
  const s=currentSelection[`leg${leg}`], legEl=$(`leg${leg}`), st=$(`leg${leg}-state`);
  if(s.e&&s.d){ legEl.classList.add('done'); st.innerText=({A:'Asset',L:'Liability',E:'Equity'})[s.e]+(s.d==='+'?' increases':' decreases'); }
  else { legEl.classList.remove('done'); st.innerText = s.e?'Now pick a direction':'Now pick an element'; }
}

function evaluateUserStrike(){
  const s=currentSelection;
  if(!s.leg1.e||!s.leg1.d||!s.leg2.e||!s.leg2.d){ setCommentaryText("Umpire: set both ledger legs (element and direction) before you swing.",false); return; }
  clearInterval(timerInterval); isQuestionActive=false;
  const q=dataset()[currentIdx];
  const correct=(s.leg1.e===q.e1&&s.leg1.d===q.d1&&s.leg2.e===q.e2&&s.leg2.d===q.d2)||(s.leg2.e===q.e1&&s.leg2.d===q.d1&&s.leg1.e===q.e2&&s.leg1.d===q.d2);
  let runsScored=0, banner="";
  if(correct){
    if(timeLeft>=20){ runsScored=6; banner=`<span class="result-emoji">💥</span><div class="result-big six">SIX!</div><div class="result-sub">Superb timing · +6 runs</div>`; setCommentaryText(`${playerName} hammers a monster six into the corporate stands!`,true); }
    else if(timeLeft>=15){ runsScored=4; banner=`<span class="result-emoji">⚡</span><div class="result-big four">FOUR!</div><div class="result-sub">Pierces the gap · +4 runs</div>`; setCommentaryText(`${playerName} drives it beautifully to the boundary.`,true); }
    else if(timeLeft>=10){ runsScored=3; banner=`<span class="result-emoji">🏃</span><div class="result-big run">3 RUNS</div><div class="result-sub">Hard running between the wickets</div>`; setCommentaryText(`${playerName} takes a hard-fought three.`,true); }
    else if(timeLeft>=5){ runsScored=2; banner=`<span class="result-emoji">🏃</span><div class="result-big run">2 RUNS</div><div class="result-sub">Worked into deep midwicket</div>`; setCommentaryText(`${playerName} places it in the gap for a double.`,true); }
    else { runsScored=1; banner=`<span class="result-emoji">☝️</span><div class="result-big run">1 RUN</div><div class="result-sub">Quick single before the buzzer</div>`; setCommentaryText(`${playerName} steals a single off the delivery.`,true); }
    totalRuns+=runsScored;
  } else {
    banner=`<span class="result-emoji">🎯</span><div class="result-big out">HOWZAT!</div><div class="result-sub">Clean bowled · 0 runs</div>`;
    setCommentaryText(`Howzat! ${playerName} missed the line completely. Stumps shattered!`,false);
  }
  if(!SHOW_SCORES){
    banner = correct
      ? `<span class="result-emoji">🏏</span><div class="result-big good">GOOD SHOT</div><div class="result-sub">Your entry balanced the equation</div>`
      : `<span class="result-emoji">🎯</span><div class="result-big out">HOWZAT!</div><div class="result-sub">That entry didn't balance</div>`;
    setCommentaryText(correct ? `${playerName} connects cleanly. The scorers have noted it.` : `Howzat! ${playerName} missed the line. Stumps rattled.`, correct);
  }
  matchLog.push({question:q.q,wasCorrect:correct,runs:runsScored,concept:q.concept,secondsLeft:timeLeft,answer:`${s.leg1.e}${s.leg1.d}/${s.leg2.e}${s.leg2.d}`,outcome:correct?"hit":"bowled"});
  currentIdx++; animateRuns(totalRuns); renderBallStrip();
  deployIntermissionOverlay(banner,q.concept);
  if(SHOW_SCORES ? runsScored>=4 : correct){ flash('gold'); confetti(); } else if(!correct){ flash('red'); }
}

function deployIntermissionOverlay(banner,concept){
  const arena=$('game-arena'); const node=document.createElement('div'); node.className='overlay';
  node.innerHTML=`<div class="pop-card">${banner}
    <div class="verify"><span>Why</span><p>${concept}</p></div>
    <button onclick="renderQuestion()" class="action-btn gold">Next ball 🏏</button></div>`;
  arena.appendChild(node);
}

function triggerAntiCheatInfraction(){
  if(!isQuestionActive) return;
  clearInterval(timerInterval); isQuestionActive=false;
  const q=dataset()[currentIdx];
  setCommentaryText(`Umpire's call: ${playerName} left the field of play mid-delivery.`,false);
  matchLog.push({question:q.q,wasCorrect:false,runs:0,concept:"Anti-cheat penalty: leaving the game window cancels the delivery.",secondsLeft:timeLeft,answer:"",outcome:"tab-switch"});
  currentIdx++; renderBallStrip();
  deployIntermissionOverlay(`<span class="result-emoji">⚠️</span><div class="result-big warn">DOT BALL</div><div class="result-sub">Tab switching penalty</div>`,"Focus left the game window during a live ball, so this delivery scores zero. Stay on this tab until the innings ends.");
  flash('red');
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) triggerAntiCheatInfraction(); });
window.addEventListener("blur",()=>{ triggerAntiCheatInfraction(); });

function startCountdown(){
  $('arc').style.transition='none'; setRing(); void $('arc').offsetWidth; $('arc').style.transition='';
  timerInterval=setInterval(()=>{
    timeLeft--; setRing();
    if(timeLeft<=0){
      clearInterval(timerInterval); isQuestionActive=false;
      const q=dataset()[currentIdx];
      setCommentaryText(`Timed out! ${playerName} never played a shot.`,false);
      matchLog.push({question:q.q,wasCorrect:false,runs:0,concept:q.concept,secondsLeft:0,answer:"",outcome:"timeout"});
      currentIdx++; renderBallStrip();
      deployIntermissionOverlay(`<span class="result-emoji">⏱️</span><div class="result-big warn">DOT BALL</div><div class="result-sub">Time expired</div>`,"Both ledger legs must be locked in before the 30-second clock runs out.");
      flash('red');
    }
  },1000);
}

function renderCompanyDraftScreen(){
  $('top-scoreboard').classList.remove('on');
  const teams=Object.keys(corporateDatabase).map(c=>{const m=teamMeta[c]||{abbr:c.slice(0,3).toUpperCase(),sector:"",color:"var(--sky)"};
    return `<button class="team" onclick="selectCorporateTeam('${c}')"><span class="mono" style="background:${m.color}">${m.abbr}</span><b>${c}</b><small>${m.sector}</small></button>`;}).join('');
  showScreen(`
    <div class="card">
      <div class="eyebrow">Warm-up complete${SHOW_SCORES?` · ${totalRuns} runs on the board`:``}</div>
      <h2 class="h-display" style="font-size:32px;margin-top:2px">Draft your innings team</h2>
      <p style="font-size:12.5px;color:var(--muted);margin-top:6px">Pick one Indian enterprise. Its balance-sheet moves become your final 10 deliveries.</p>
      <div class="teams">${teams}</div>
    </div>`);
  setCommentaryText(`${playerName} is at the draft table choosing a company.`);
}

function selectCorporateTeam(name){
  identifiedCompany=name; dynamicActiveMatchSet=corporateDatabase[name];
  setCommentaryText(`${identifiedCompany}'s ledger is on the board. Second innings begins.`,true);
  $('top-scoreboard').classList.add('on'); currentRound=2; currentIdx=0; renderQuestion();
}

// ================= GOOGLE SHEETS =================
function buildScorePayload(){
  const warmupRuns=matchLog.slice(0,10).reduce((a,b)=>a+b.runs,0), mainRuns=matchLog.slice(10).reduce((a,b)=>a+b.runs,0);
  const finishedAt=new Date();
  return { secret:SHEET_SECRET, attemptId, match:MATCH_LABEL, studentName:playerName, rollNumber, section:studentSection, company:identifiedCompany,
    totalScore:totalRuns, warmupRuns, mainRuns, correctAnswers:matchLog.filter(l=>l.wasCorrect).length, ballsFaced:matchLog.length,
    tabSwitchPenalties:matchLog.filter(l=>l.outcome==="tab-switch").length, timeouts:matchLog.filter(l=>l.outcome==="timeout").length,
    durationSeconds:matchStartedAt?Math.round((finishedAt-matchStartedAt)/1000):null, startedAt:matchStartedAt?matchStartedAt.toISOString():null,
    finishedAt:finishedAt.toISOString(), ballByBall:matchLog.map((l,i)=>`B${i+1}:${l.runs}${l.wasCorrect?"":"x"}`).join(" "), userAgent:navigator.userAgent };
}
async function submitScoreToSheet(){
  if(!GOOGLE_SCRIPT_URL){ syncState={status:"off",message:"Practice mode · score not recorded"}; refreshSyncPill(); return; }
  syncState={status:"busy",message:"Sending score to the class sheet…"}; refreshSyncPill();
  const payload=JSON.stringify(buildScorePayload());
  try{
    const res=await fetch(GOOGLE_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:payload,redirect:"follow"});
    let ok=res.ok;
    try{ const data=await res.json(); ok=data&&data.result==="success"; if(!ok) throw new Error(data&&data.error?data.error:"Sheet rejected the entry"); }
    catch(parseErr){ if(!ok) throw parseErr; }
    syncState={status:"ok",message:"Score recorded on the class sheet"};
  }catch(e){
    try{ await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",body:payload}); syncState={status:"ok",message:"Score sent to the class sheet"}; }
    catch(e2){ syncState={status:"err",message:"Couldn't reach the class sheet."}; console.error(e2); }
  }
  refreshSyncPill();
}
function refreshSyncPill(){
  const pill=$('sync-pill'); if(!pill) return;
  const icons={idle:"•",busy:"⏳",ok:"✅",err:"⚠️",off:"🔕"};
  pill.className=`sync-pill ${syncState.status}`;
  pill.innerHTML=`<span>${icons[syncState.status]||"•"}</span><span>${syncState.message}</span>`+(syncState.status==="err"?`<button class="retry-link" onclick="submitScoreToSheet()">Retry</button>`:"");
}
function finalizeScoreAndLogSheet(){ $('top-scoreboard').classList.remove('on'); renderGameOverSummary(); submitScoreToSheet(); }

function renderGameOverSummary(){
  const sixes=matchLog.filter(l=>l.runs===6).length, fours=matchLog.filter(l=>l.runs===4).length, correct=matchLog.filter(l=>l.wasCorrect).length, wickets=matchLog.length-correct;
  const entries=matchLog.map((l,i)=>`
    <div class="entry ${l.wasCorrect?(l.runs===6?'six':'hit'):'out'}" style="animation-delay:${Math.min(i*40,500)}ms">
      <div class="badge">${SHOW_SCORES?(l.wasCorrect?l.runs:'W'):(l.wasCorrect?'✓':'✗')}</div>
      <div><h4>Ball ${i+1} · ${l.question}</h4><p><b>Why:</b> ${l.concept}</p></div>
    </div>`).join('');
  showScreen(`
    <div class="card summary" style="text-align:center;padding:18px 16px 14px">
      <span class="trophy">🏆</span>
      <div class="eyebrow" style="margin-top:4px">Innings closed · ${playerName}${rollNumber?` · ${rollNumber}`:''}${studentSection?` · Sec ${studentSection}`:''}</div>
      ${SHOW_SCORES?`<div class="final" id="final-runs">0</div>`:`<h2 class="h-display" style="font-size:34px;margin:4px 0 6px">Innings complete</h2><p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Your scorecard has gone to the umpires. Your instructor will announce the runs.</p>`}
      <div class="stats" style="${SHOW_SCORES?'':'display:none'}">
        <div class="stat"><strong style="color:var(--gold)">${sixes}</strong><small>Sixes</small></div>
        <div class="stat"><strong style="color:var(--turf-2)">${fours}</strong><small>Fours</small></div>
        <div class="stat"><strong style="color:var(--sky)">${correct}/20</strong><small>Correct</small></div>
        <div class="stat"><strong style="color:var(--ball)">${wickets}</strong><small>Wickets</small></div>
      </div>
      <div id="sync-pill" class="sync-pill idle"><span>•</span><span>Preparing scorecard…</span></div>
      <div class="ledger">${entries}</div>
      <button onclick="confirmGuardAndStart()" class="action-btn gold" style="margin-top:0">Play new innings</button>
    </div>`);
  const el=$('final-runs'); if(el){ const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/1100); el.innerText=Math.round(totalRuns*(1-Math.pow(1-p,3))); if(p<1&&!reduceMotion) requestAnimationFrame(step); else el.innerText=totalRuns;};
  requestAnimationFrame(step); }
  setCommentaryText(`Innings closed. A fine knock from ${playerName}.`,true);
}

window.onload=loadWelcomeView;
</script>
