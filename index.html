<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPER - Financial Premier League</title>
    <style>
        /* PURE NATIVE CSS STYLING - NO EXTERNAL LINKS */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0b111e;
            background: linear-gradient(135deg, #111c34 0%, #080d18 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            overflow: hidden;
        }

        /* Scoreboard Layout Styles */
        .header-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #162544;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #2d3f66;
            width: 100%;
        }

        .score-text {
            font-size: 28px;
            font-weight: 700;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .timer-badge {
            background-color: #10b981;
            color: #0b111e;
            padding: 6px 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            min-width: 75px;
        }

        .timer-danger {
            background-color: #ef4444 !important;
            color: #ffffff !important;
        }

        /* Game Arena Interface */
        #game-arena {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            width: 100%;
            position: relative;
        }

        .card {
            background-color: #162544;
            border: 1px solid #2d3f66;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .input-field {
            width: 100%;
            background-color: #080d18;
            border: 1px solid #2d3f66;
            border-radius: 8px;
            padding: 12px;
            color: #fbbf24;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
            outline: none;
        }

        /* Interactive Grid Layouts */
        .vector-box {
            background-color: #0f192e;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 10px;
            width: 100%;
        }

        .btn-grid-3 {
            display: grid;
            grid-cols: 3;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        button {
            background-color: #1f293d;
            border: 1px solid #2d3f66;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.97);
        }

        .selected-btn {
            background-color: #38bdf8 !important;
            color: #0b111e !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: #0b111e;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            margin-top: 10px;
        }

        /* Popup overlay blocks */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 16px;
        }

        .pop-card {
            background-color: #162544;
            border: 2px solid #2d3f66;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        /* Bottom Commentary Ribbon */
        #commentary {
            background-color: rgba(5, 10, 20, 0.8);
            border: 1px dashed #2d3f66;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-style: italic;
            color: #94a3b8;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="top-scoreboard" class="header-board" style="display: none;">
        <div>
            <span id="player-display" style="font-size: 12px; color: #38bdf8; font-weight: 700; text-transform: uppercase; display: block;">Batsman: Player</span>
            <div style="display: flex; align-items: baseline; margin-top: 2px;">
                <span id="runs" class="score-text">0</span>
                <span style="font-size: 12px; color: #94a3b8; margin-left: 4px; font-weight: 700; text-transform: uppercase;">Runs</span>
                <span id="ball-counter" style="font-size: 12px; color: #10b981; margin-left: 15px; background: rgba(16,185,129,0.1); padding: 2px 6px; border-radius: 4px;">0/20 Balls</span>
            </div>
        </div>
        <div id="timer-box" class="timer-badge">
            <div style="font-size: 10px; text-transform: uppercase; margin-bottom: 2px; opacity: 0.8;">Timer</div>
            <div id="timer" style="font-size: 20px;">30s</div>
        </div>
    </div>

    <div id="game-arena">
        </div>

    <div id="commentary">
        IPER Stadium initialization complete. Waiting for batsman registration...
    </div>

    <script>
        // CORE MATCH CONTROLLER ARCHITECTURE
        let playerName = "Player";
        let currentIdx = 0;
        let totalRuns = 0;
        let timerInterval = null;
        let timeLeft = 30;
        let currentRound = 1; 
        let currentSelection = { leg1: {e:null, d:null}, leg2: {e:null, d:null} };
        let matchLog = [];
        let identifiedCompany = "Corporate Enterprise";
        let isQuestionActive = false;

        const corporateDatabase = {
            "Reliance Industries": [
                { q: "Reliance Industries issues Non-Convertible Debentures (NCDs) worth ₹2,500 Crores.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Long-term debt issuance increases Assets (Cash Reserves) and increases Liabilities (Debentures Debt)." },
                { q: "Jio Infocomm settles pending government spectrum license usage dues of ₹800 Crores.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Settling dues reduces corporate Assets (Bank) and reduces corresponding Liabilities (Government Dues)." },
                { q: "Reliance Retail acquires a regional consumer brand warehouse for ₹150 Crores cash.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Strategic acquisition increases Fixed Assets (Property) and reduces liquid Assets (Cash)." },
                { q: "RIL Board approves and pays equity dividend distribution worth ₹1,200 Crores.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Dividend deployment reduces macro Assets (Cash Balance) and reduces total Equity (Retained Reserves)." },
                { q: "Reliance O2C division ships refined petrochemicals worth ₹5,000 Crores on 30-day credit.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Credit sales operations increase corporate Assets (Trade Receivables) and increase Equity (Revenue)." },
                { q: "RIL repays a maturing Foreign Currency Syndicated Loan facility of $100 Million.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "External debt clearing decreases monetary Assets (Cash) and decreases external Liabilities (Foreign Loans)." },
                { q: "Reliance New Energy deploys ₹300 Crores capital into setting up advanced solar panel grids.", e1:"A", d1:"-", e2:"A", d2:"+", concept: "Capital expenditure converts liquid Assets (Cash/Bank) into long-term capital Assets (Plant/Equipment)." },
                { q: "Jio Platforms receives ₹4,500 Crores foreign direct investment cash from a global tech giant.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Strategic equity issuance increases liquid Assets (Bank) and expands structural Equity (Share Capital)." },
                { q: "RIL executes an open-market corporate equity share buyback program totaling ₹600 Crores.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Stock buybacks reduce cash Assets (Bank) and contract overall corporate Equity (Treasury/Paid-up Capital)." },
                { q: "Reliance O2C division closes cross-border fuel exports; receives cash instantly in its Forex account.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Immediate export settlements expand modern Assets (Forex Cash) and increase Equity holdings (Earnings)." }
            ],
            "ITC Limited": [
                { q: "ITC Limited launches a new FMCG facility in Odisha costing ₹400 Crores paid via cash balances.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "CapEx updates composition: Increases Fixed Assets (Property, Plant) and decreases current Assets (Cash)." },
                { q: "ITC issues short-term commercial papers worth ₹300 Crores to finance seasonal leaf tobacco buying.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Short-term funding arrays increase liquid Assets (Bank) and expand short-term Liabilities (Commercial Paper)." },
                { q: "ITC buys raw materials for packaging operations worth ₹85 Crores on 45 days open credit.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Inventory expansion increases Assets (Materials) and increases trade operational Liabilities (Creditors)." },
                { q: "ITC Hotels pays municipal property duties and pending local taxes worth ₹12 Crores through bank transfer.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Paying off taxes reduces balance sheet Assets (Bank) and discharges current tax Liabilities." },
                { q: "ITC registers massive pan-India wholesale distributor cigarette product revenue of ₹1,200 Crores in cash.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Sales collection expands liquid corporate Assets (Bank) and updates overall Retained Equity via profits." },
                { q: "ITC Agriculture division sells wheat and agribusiness commodities on credit to an exporter for ₹150 Crores.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Credit shipments increase matching current Assets (Trade Debtors) and increase transactional Equity (Revenue)." },
                { q: "ITC receives a secure cash dividend of ₹45 Crores from its associate or subsidiary investment fields.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Non-operating dividend revenue expands cash financial Assets (Bank) and pushes up Equity holdings." },
                { q: "ITC settles its final annual dividend outlays of ₹900 Crores to public institutional investors.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Dividend cash allocation contracts cash Assets (Bank) and decreases Retained Earnings in Equity." },
                { q: "An institutional buyer clears an old trade debt of ₹60 Crores into ITC's central SBI account.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Receivable collection increments liquid Assets (Bank) and reduces matching Assets (Trade Receivables)." },
                { q: "ITC writes down decayed or obsolete hotel kitchen assets valuing ₹8 Crores inside its statement lines.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Non-cash write-downs decrease long-term property Assets and decrease Equity via asset impairment losses." }
            ],
            "Tata Motors": [
                { q: "Tata Motors draws down a commercial facility of ₹600 Cr from Axis Bank to expand Sanand EV plant.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Bank fund ingestion triggers current Asset rise matched with short-term borrowing Liabilities." },
                { q: "Tata Motors settles its vendor payables of ₹180 Cr via automated corporate electronic clearing.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Paying raw material vendors reduces monetary bank Assets and cancels current trade Liabilities." },
                { q: "The firm delivers 500 commercial EV buses to Delhi DTC; invoices ₹350 Cr with payment due in 60 days.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Credit deliveries create current operational Assets (Debtors) and add to corporate Equity lines via revenues." },
                { q: "Tata Motors sells off scrap machinery items for ₹14 Crores collected into the cash balances ledger.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Equipment disposal reduces long-term physical Assets and raises current liquid cash Assets." },
                { q: "Tata Motors deploys ₹500 Cr into institutional R&D software frameworks for advanced battery cells.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Expensed development budgets drop corporate bank Assets and compress Equity margins through operational expense." },
                { q: "The firm issues corporate commercial notes of ₹400 Cr to institutional fund houses in Mumbai.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Issuing short-term notes increments bank financial Assets and generates current debt Liabilities." },
                { q: "Tata Motors writes down impaired tooling assets worth ₹25 Cr due to manufacturing design model shifts.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Impairment write-downs diminish long-term property Assets and decrease equity margins via losses." },
                { q: "Tata Motors receives ₹800 Cr cash subscription for equity share premiums in its EV subsidiary layer.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Capital issuance lifts central bank cash Assets and increases structural Share Capital Equity reserves." },
                { q: "The company pays ₹75 Lakhs interest dues on long-term debentures listed on the NSE.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Interest expense deployment decreases cash Assets and reduces corporate Equity lines via finance costs." },
                { q: "A major automotive dealer clears an old outstanding vehicle consignment balance of ₹90 Cr via bank link.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Receivable clearing grows liquid bank Assets and deflates outstanding trade dealer Assets." }
            ],
            "Infosys": [
                { q: "Infosys receives ₹1,200 Cr electronic fund settlement from a global retail client for cloud architecture systems deployment.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Collection of trade accounts receivable raises liquid bank Assets and drops trade debtor Assets." },
                { q: "Infosys pays out regular employee software engineer salaries totaling ₹450 Cr via digital wire networks.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Salary outlays drop cash bank Assets and lower Equity value by logging operating talent expenses." },
                { q: "Infosys logs consulting revenue worth ₹600 Cr for automated AI design systems; bills client for net-30 collection.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Accrued operating revenues expand current debtor Assets and grow retained Equity balances." },
                { q: "Infosys buys new corporate server clusters in Bangalore for ₹80 Cr cash to expand data operations.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "CapEx shifts cash balance Assets into fixed physical tech infrastructure Assets." },
                { q: "Infosys Board deploys an interim shareholder dividend cash allocation worth ₹350 Cr.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Dividend deployment decreases liquid bank Assets and decreases cumulative retained Equity reserves." },
                { q: "Infosys liquidates corporate treasury bonds worth ₹200 Cr to raise immediate strategic cash reserves.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Investment conversion raises liquid bank Assets and deflates financial investment Assets." },
                { q: "Infosys settles its advance corporate income tax installment of ₹110 Cr to the central government.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Tax obligation processing contracts liquid cash Assets and discharges legal current tax Liabilities." },
                { q: "Infosys provisions a non-cash office depreciation entry of ₹15 Cr across its global tech parks.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Depreciation decreases book value of long-term property Assets and drops Equity via non-cash operating expense." },
                { q: "Infosys takes out a premium building lease contract on credit, creating a liability setup of ₹40 Cr.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Lease capitalization increases right-of-use operational Assets and generates long-term lease obligations Liabilities." },
                { q: "Infosys clears a vendor software license bill of ₹18 Cr via electronic bank payment channels.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Paying licensing vendors drops digital bank Assets and discharges corresponding operational trade Liabilities." }
            ]
        };

        const questions = {
            warmup: [
                { q: "Started an MBA venture with ₹25 Lakhs seed capital deposit.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Capital Introduction increases Assets (Cash) and increases Equity (Owner's Capital)." },
                { q: "Purchased office laptops worth ₹3 Lakhs paying cash instantly.", e1:"A", d1:"-", e2:"A", d2:"+", concept: "Asset Transformation shifts composition: Increases Assets (Equipment), decreases Assets (Cash)." },
                { q: "Procured commercial goods worth ₹4 Lakhs on credit terms from a vendor.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Credit Purchase increases Assets (Inventory) and increases Liabilities (Creditors)." },
                { q: "Disbursed ₹60,000 corporate building rent via HDFC net banking accounts.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Rent expense reduces Assets (Bank) and reduces Equity (Retained Earnings via Expense)." },
                { q: "Executed consultancy work for client; collected ₹1.5 Lakhs immediately via UPI.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Revenue Generation increases Assets (Bank) and increases Equity (Retained Earnings via Profit)." },
                { q: "Secured an emergency short-term business loan of ₹8 Lakhs from SBI.", e1:"A", d1:"+", e2:"L", d2:"+", concept: "Loan borrowing increases Assets (Bank Cash) and increases Liabilities (Bank Loan)." },
                { q: "Settled outstanding payment of ₹1.2 Lakhs owed to a raw material supplier.", e1:"A", d1:"-", e2:"L", d2:"-", concept: "Liability settlement decreases Assets (Cash/Bank) and decreases Liabilities (Accounts Payable)." },
                { q: "Rendered training services to a corporate client worth ₹2 Lakhs; payment due next month.", e1:"A", d1:"+", e2:"E", d2:"+", concept: "Accrued Revenue increases Assets (Debtors) and increases Equity (Retained Earnings)." },
                { q: "An old trade debtor clears their outstanding bill of ₹80,000 via electronic transfer.", e1:"A", d1:"+", e2:"A", d2:"-", concept: "Debtor collection increases Assets (Bank) and decreases Assets (Accounts Receivable)." },
                { q: "The company pays a corporate cash dividend of ₹1 Lakh to its equity shareholders.", e1:"A", d1:"-", e2:"E", d2:"-", concept: "Dividend payout directly reduces Assets (Cash) and reduces Equity (Retained Earnings distribution)." }
            ]
        };

        let dynamicActiveMatchSet = [];

        function showScreen(html) {
            document.getElementById('game-arena').innerHTML = html;
        }

        function loadWelcomeView() {
            showScreen(`
                <div class="card">
                    <div style="font-size: 50px; margin-bottom: 5px;">🏏</div>
                    <h1 style="font-size: 24px; color: #38bdf8; font-weight: 700; margin-bottom: 2px;">IPER</h1>
                    <h2 style="font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 1px; margin-bottom: 15px;">FINANCIAL PREMIER LEAGUE</h2>
                    
                    <div style="text-align: left; margin-bottom: 20px;">
                        <label style="font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-left: 2px;">Batsman Name</label>
                        <input type="text" id="username" value="Abhishek" class="input-field" placeholder="Enter Name...">
                    </div>
                    
                    <button onclick="displayRulesPlaybook()" class="action-btn" style="font-weight:700; text-transform: uppercase; letter-spacing:1px;">Next</button>
                </div>
            `);
        }

        function displayRulesPlaybook() {
            const input = document.getElementById('username').value.trim();
            if(!input) { alert("Please write your name to register for the match!"); return; }
            playerName = input;
            document.getElementById('player-display').innerText = `Batsman: ${playerName}`;

            showScreen(`
                <div class="card" style="max-width: 380px; text-align: left;">
                    <h2 style="font-size: 16px; font-weight: 700; color: #fbbf24; text-transform: uppercase; text-align: center; border-bottom: 1px solid #2d3f66; padding-bottom: 8px; margin-bottom: 12px;">📋 MATCH REGULATIONS</h2>
                    
                    <div style="font-size: 12px; color: #cbd5e1; line-height: 1.6; margin-bottom: 15px; height: 220px; overflow-y: auto; padding-right: 4px;">
                        <p style="margin-bottom: 8px;"><strong style="color: #38bdf8;">1. Total Structure:</strong> You will face 20 deliveries. 10 Warmup Rounds + 10 Live Sector Matches.</p>
                        <p style="margin-bottom: 8px;"><strong style="color: #38bdf8;">2. Balance Formula:</strong> You must populate BOTH ledger impact rows for every delivery to maintain the Accounting Equation ($A = L + E$).</p>
                        <p style="margin-bottom: 8px;"><strong style="color: #38bdf8;">3. Run Scaling Matrix:</strong> Faster entries score higher runs:
                            <span style="display:block; padding-left: 10px; color:#94a3b8;">• 20s-30s Left = 6 Runs (💥 Boundary Six)</span>
                            <span style="display:block; padding-left: 10px; color:#94a3b8;">• 15s-20s Left = 4 Runs (⚡ Boundary Four)</span>
                            <span style="display:block; padding-left: 10px; color:#94a3b8;">• Below 15s = 3, 2, or 1 Run adjustments</span>
                        </p>
                        <p style="margin-bottom: 8px;"><strong style="color: #38bdf8;">4. Sector Selection:</strong> After delivery 10, you will draft an elite Indian company to customize your remaining match board content dynamically.</p>
                        <p style="color: #ef4444;"><strong style="color: #ef4444;">🚨 5. AI Anti-Cheat Detection:</strong> Navigating away from this browser tab, minimizing the layout window, or splitting screens will trigger an automatic Umpire penalty, resulting in an immediate **Dot Ball (0 Runs)**.</p>
                    </div>

                    <button onclick="confirmGuardAndStart()" class="action-btn" style="background-color: #10b981; font-weight:700;">TAKE GUARD & PLAY</button>
                </div>
            `);
            setCommentaryText(`Batsman ${playerName} is tracking local pitch conditions in the dugout.`);
        }

        function confirmGuardAndStart() {
            document.getElementById('top-scoreboard').style.display = 'flex';
            currentRound = 1;
            currentIdx = 0;
            totalRuns = 0;
            matchLog = [];
            renderQuestion();
        }

        function renderQuestion() {
            clearInterval(timerInterval);
            isQuestionActive = false;
            
            const dataset = currentRound === 1 ? questions.warmup : dynamicActiveMatchSet;
            
            if (currentIdx >= 10) {
                if (currentRound === 1) renderCompanyDraftScreen();
                else renderGameOverSummary();
                return;
            }

            const qData = dataset[currentIdx];
            timeLeft = 30;
            currentSelection = { leg1: {e:null, d:null}, leg2: {e:null, d:null} };
            
            updateHeaderMetrics();
            startCountdown();
            isQuestionActive = true;

            showScreen(`
                <div class="card" style="max-width: 380px;">
                    <div style="background-color: #080d18; border: 1px solid #1e2d4a; padding: 15px; border-radius: 12px; font-weight: 600; font-size: 15px; line-height: 1.4; margin-bottom: 12px; min-height: 80px; display: flex; align-items: center; justify-content: center;">
                        <p style="color: #f8fafc;">${qData.q}</p>
                    </div>

                    ${[1, 2].map(leg => `
                        <div class="vector-box">
                            <div style="font-size: 10px; color: #38bdf8; font-weight: 700; text-transform: uppercase; text-align: left; margin-bottom: 6px; tracking: 1px;">Equation Element Side ${leg}</div>
                            <div class="btn-grid-3">
                                <button id="l${leg}-e-A" onclick="allocateSelection('${leg}','e','A')">Asset</button>
                                <button id="l${leg}-e-L" onclick="allocateSelection('${leg}','e','L')">Liability</button>
                                <button id="l${leg}-e-E" onclick="allocateSelection('${leg}','e','E')">Equity</button>
                            </div>
                            <div class="btn-grid-2">
                                <button id="l${leg}-d-plus" onclick="allocateSelection('${leg}','d','+')">Increase (+)</button>
                                <button id="l${leg}-d-minus" onclick="allocateSelection('${leg}','d','-')">Decrease (-)</button>
                            </div>
                        </div>
                    `).join('')}

                    <button onclick="evaluateUserStrike()" class="action-btn" style="background-color: #10b981; font-weight: 700;">SUBMIT (HIT THE BALL)</button>
                </div>
            `);
        }

        function allocateSelection(leg, type, val) {
            currentSelection[`leg${leg}`][type] = val;
            
            // Re-render selection button high-impact states manually inside node structures
            if (type === 'e') {
                ['A', 'L', 'E'].forEach(v => {
                    const el = document.getElementById(`l${leg}-e-${v}`);
                    if(el) el.className = (v === val) ? 'selected-btn' : '';
                });
            } else {
                ['plus', 'minus'].forEach(v => {
                    const mappedId = (v === 'plus') ? '+' : '-';
                    const el = document.getElementById(`l${leg}-d-${v}`);
                    if(el) el.className = (mappedId === val) ? 'selected-btn' : '';
                });
            }
        }

        function evaluateUserStrike() {
            const s = currentSelection;
            if(!s.leg1.e || !s.leg1.d || !s.leg2.e || !s.leg2.d) { alert("Accounting balances require configuring both transactional legs!"); return; }
            
            clearInterval(timerInterval);
            isQuestionActive = false;
            
            const dataset = currentRound === 1 ? questions.warmup : dynamicActiveMatchSet;
            const q = dataset[currentIdx];

            const correct = (s.leg1.e===q.e1 && s.leg1.d===q.d1 && s.leg2.e===q.e2 && s.leg2.d===q.d2) || 
                            (s.leg2.e===q.e1 && s.leg2.d===q.d1 && s.leg1.e===q.e2 && s.leg1.d===q.d2);

            let runsScored = 0;
            let feedbackBanner = "";

            if (correct) {
                if (timeLeft >= 20) {
                    runsScored = 6;
                    feedbackBanner = `<h1 style="font-size: 44px; font-weight: 900; color: #10b981; margin-bottom: 2px;">💥 SIX!</h1><p style="font-size: 12px; text-transform: uppercase; font-weight:700; color: #f8fafc;">Superb Timing! +6 Runs</p>`;
                    setCommentaryText(`${playerName} hammers a MONSTER SIX into the corporate stands!`, true);
                } else if (timeLeft >= 15) {
                    runsScored = 4;
                    feedbackBanner = `<h1 style="font-size: 44px; font-weight: 900; color: #38bdf8; margin-bottom: 2px;">⚡ FOUR!</h1><p style="font-size: 12px; text-transform: uppercase; font-weight:700; color: #f8fafc;">Pierces the field gap! +4 Runs</p>`;
                    setCommentaryText(`${playerName} drives it beautifully to the boundary line!`, true);
                } else if (timeLeft >= 10) {
                    runsScored = 3;
                    feedbackBanner = `<h1 style="font-size: 36px; font-weight: 900; color: #fbbf24; margin-bottom: 2px;">🏃 3 RUNS</h1><p style="font-size: 12px; text-transform: uppercase; font-weight:700; color: #f8fafc;">Excellent hustle between the creases.</p>`;
                    setCommentaryText(`${playerName} takes a hard-fought three runs.`, true);
                } else if (timeLeft >= 5) {
                    runsScored = 2;
                    feedbackBanner = `<h1 style="font-size: 36px; font-weight: 900; color: #a3e635; margin-bottom: 2px;">🏃 2 RUNS</h1><p style="font-size: 12px; text-transform: uppercase; font-weight:700; color: #f8fafc;">Worked softly into deep midwicket.</p>`;
                    setCommentaryText(`${playerName} places it in the gap for a double.`, true);
                } else {
                    runsScored = 1;
                    overlayHTML = `<h1 style="font-size: 32px; font-weight: 900; color: #cbd5e1; margin-bottom: 2px;">☝️ 1 RUN</h1><p style="font-size: 12px; text-transform: uppercase; font-weight:700; color: #f8fafc;">Just a quick single before the buzzer.</p>`;
                    setCommentaryText(`${playerName} steals a single off the delivery.`, true);
                }
                totalRuns += runsScored;
            } else {
                feedbackBanner = `<h1 style="font-size: 40px; font-weight: 900; color: #ef4444; margin-bottom: 2px;">🚨 HOWZAT!</h1><p style="font-size: 12px; text-transform: uppercase; font-weight:700; color: #f8fafc;">Clean Bowled! 0 Runs</p>`;
                setCommentaryText(`HOWZAT! ${playerName} missed the line completely. Wickets shattered!`, false);
            }

            matchLog.push({
                question: q.q,
                wasCorrect: correct,
                runs: runsScored,
                concept: q.concept
            });

            currentIdx++;
            deployIntermissionOverlay(feedbackBanner, q.concept);
        }

        function deployIntermissionOverlay(bannerContent, breakdownConcept) {
            const arena = document.getElementById('game-arena');
            const overlayNode = document.createElement('div');
            overlayNode.className = 'overlay';
            overlayNode.innerHTML = `
                <div class="pop-card">
                    <div>${bannerContent}</div>
                    <div style="border-top: 1px solid #2d3f66; padding-top: 10px; margin-top: 12px; text-align: left;">
                        <span style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #38bdf8; display: block;">Verification:</span>
                        <p style="font-size: 11px; color: #cbd5e1; line-height: 1.4; margin-top: 2px; font-weight: 600;">${breakdownConcept}</p>
                    </div>
                    <button onclick="renderQuestion()" class="action-btn" style="background: linear-gradient(to r, #fbbf24, #f59e0b); font-weight: 700; margin-top:15px;">
                        READY FOR NEXT BALL 🏏
                    </button>
                </div>
            `;
            arena.appendChild(overlayNode);
        }

        function triggerAntiCheatInfraction() {
            if (!isQuestionActive) return;
            
            clearInterval(timerInterval);
            isQuestionActive = false;

            const dataset = currentRound === 1 ? questions.warmup : dynamicActiveMatchSet;
            const q = dataset[currentIdx];

            setCommentaryText(`⚠️ ILLEGAL FIELD DEPLOYMENT! ${playerName} exited game layout context boundaries.`, false);

            matchLog.push({
                question: q.q,
                wasCorrect: false,
                runs: 0,
                concept: "ANTI-CHEAT PENALTY: Disconnecting focal application interfaces flags an automatic safety transaction cancel."
            });

            currentIdx++;

            const warningHTML = `<h1 style="font-size: 32px; font-weight: 900; color: #f97316; margin-bottom: 2px;">⚠️ DOT BALL</h1><p style="font-size: 11px; text-transform: uppercase; font-weight:700; color: #f8fafc;">Tab Switching Violation Registered</p>`;
            deployIntermissionOverlay(warningHTML, "ANTI-CHEAT LOCKOUT: Focus changes out of the running web space will instantly zero the current delivery scoring window.");
        }

        // DEPLOY FOCUS INTERCEPTION LISTENERS DIRECTLY
        document.addEventListener("visibilitychange", () => { if (document.hidden) triggerAntiCheatInfraction(); });
        window.addEventListener("blur", () => { triggerAntiCheatInfraction(); });

        function startCountdown() {
            document.getElementById('timer').innerText = timeLeft + "s";
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if(timeLeft <= 5) document.getElementById('timer-box').className = "timer-badge timer-danger animate-pulse";
                if(timeLeft <= 0) { 
                    clearInterval(timerInterval);
                    isQuestionActive = false;
                    setCommentaryText(`🛑 TIMEOUT! ${playerName} failed to trigger an appeal in 30 seconds.`, false);
                    
                    matchLog.push({
                        question: (currentRound === 1 ? questions.warmup : dynamicActiveMatchSet)[currentIdx].q,
                        wasCorrect: false,
                        runs: 0,
                        concept: (currentRound === 1 ? questions.warmup : dynamicActiveMatchSet)[currentIdx].concept
                    });
                    currentIdx++;

                    deployIntermissionOverlay(`
                        <h1 style="font-size: 36px; font-weight: 900; color: #f97316; margin-bottom:2px;">⏱️ DOT BALL</h1>
                        <p style="font-size: 12px; text-transform: uppercase; font-weight:700; color:#f8fafc;">Time Expired!</p>
                    `, "TIMEOUT ERROR: Balanced double entry decisions must be locked into place before the 30s stadium clock counts down.");
                }
            }, 1000);
        }

        function renderCompanyDraftScreen() {
            document.getElementById('top-scoreboard').style.display = 'none';
            const targets = Object.keys(corporateDatabase);
            
            let elementsHTML = targets.map(c => `
                <button onclick="selectCorporateTeam('${c}')" style="background-color: #080d18; border: 1px solid #2d3f66; padding: 12px 6px; font-size: 12px; font-weight: 700; border-radius: 10px; color: #f1f5f9;">
                    ${c}
                </button>
            `).join('');

            showScreen(`
                <div class="card" style="max-width: 380px;">
                    <h2 style="font-size: 16px; font-weight: 700; color: #fbbf24; text-transform: uppercase; margin-bottom: 4px;">🏏 INNINGS TEAM DRAFT</h2>
                    <p style="font-size: 11px; color: #94a3b8; margin-bottom: 15px;">Select 1 Indian enterprise tracking profile to map your Main Match targets.</p>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 260px; overflow-y: auto; padding-right: 2px;">
                        ${elementsHTML}
                    </div>
                </div>
            `);
            setCommentaryText(`Warmup net round completed. ${playerName} is drafting their balance sheet company sector.`);
        }

        function selectCorporateTeam(name) {
            identifiedCompany = name;
            dynamicActiveMatchSet = corporateDatabase[name];
            setCommentaryText(`Operating statements deployed for ${identifiedCompany}! Let's play.`, true);
            
            document.getElementById('top-scoreboard').style.display = 'flex';
            currentRound = 2;
            currentIdx = 0;
            renderQuestion();
        }

        function updateHeaderMetrics() {
            document.getElementById('runs').innerText = totalRuns;
            const ballNum = (currentRound === 1) ? currentIdx : currentIdx + 10;
            document.getElementById('ball-counter').innerText = `${ballNum}/20 Balls`;
            document.getElementById('timer-box').className = "timer-badge";
        }

        function setCommentaryText(msg, pos) {
            const ribbon = document.getElementById('commentary');
            ribbon.innerText = msg;
            if(pos === true) ribbon.style.borderColor = "#10b981";
            else if(pos === false) ribbon.style.borderColor = "#ef4444";
            else ribbon.style.borderColor = "#2d3f66";
        }

        function finalizeScoreAndLogSheet() {
            document.getElementById('top-scoreboard').style.display = 'none';
            if(GOOGLE_SCRIPT_URL) {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify({ studentName: playerName, totalScore: totalRuns, targetCompany: identifiedCompany, timestamp: new Date().toISOString() })
                }).catch(e => console.log(e));
            }
            renderGameOverSummary();
        }

        function renderGameOverSummary() {
            let entriesHTML = matchLog.map((log, i) => `
                <div style="background: rgba(255,255,255,0.02); border: 1px solid ${log.wasCorrect ? '#10b98140' : '#ef444440'}; border-radius: 8px; padding: 10px; text-align: left; margin-bottom: 10px;">
                    <div style="font-weight: 700; font-size: 12px; color: #f8fafc;">Ball ${i+1}: ${log.question}</div>
                    <div style="font-size: 11px; font-weight: 700; margin-top: 2px; color: ${log.wasCorrect ? '#10b981' : '#ef4444'}">
                        ${log.wasCorrect ? ` Hit for ${log.runs} Runs` : '☝️ Clean Bowled (0 Runs)'}
                    </div>
                    <div style="font-size: 11px; color: #94a3b8; background: #080d18; padding: 6px; border-radius: 4px; margin-top: 4px; border: 1px solid #1e2d4a;">
                        <span style="color: #38bdf8; font-weight: 700;">Concept:</span> ${log.concept}
                    </div>
                </div>
            `).join('');

            showScreen(`
                <div class="card" style="max-width: 380px; height: 85vh; display: flex; flex-direction: column; justify-content: space-between;">
                    <div class="celebrate-pulse" style="margin-bottom: 5px;">
                        <span style="font-size: 32px;">🏆🎆🎉</span>
                        <h2 style="font-size: 20px; font-weight: 900; color: #fbbf24; margin-top: 2px;">MATCH FINISHED!</h2>
                        <p style="font-size: 11px; color: #cbd5e1;">Incredible display at the crease, <span style="color:#38bdf8; font-weight:700;">${playerName}</span>!</p>
                    </div>

                    <div style="background-color: #080d18; border: 1px solid #2d3f66; padding: 10px; border-radius: 12px; width: 140px; margin: 0 auto 10px auto;">
                        <div style="font-size: 9px; font-weight:700; color:#94a3b8; text-transform:uppercase; tracking:1px;">Final Runs</div>
                        <div style="font-size: 32px; font-weight: 900; color: #38bdf8; line-height:1;">${totalRuns}</div>
                    </div>

                    <h3 style="font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; text-align: left; margin-bottom: 5px;">Innings Review Ledger</h3>
                    <div style="flex-grow: 1; overflow-y: auto; padding-right: 2px; border-top: 1px solid #2d3f66; padding-top: 10px; margin-bottom: 10px;">
                        ${entriesHTML}
                    </div>

                    <button onclick="confirmGuardAndStart()" class="action-btn" style="background: #fbbf24; color:#0b111e; font-weight:700; margin-top: 0; shrink:0; text-transform:uppercase; font-size:13px; letter-spacing:0.5px;">Play New Innings</button>
                </div>
            `);
            setCommentaryText(`Innings closed! Unbelievable batting display by ${playerName}!`);
        }

        // Initialize script logic immediately on window trigger
        window.onload = loadWelcomeView;
    </script>
</body>
</html>
